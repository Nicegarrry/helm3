name: Preparation validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate design provenance, Map dependencies and document links
        run: python3 scripts/check-preparation.py
  sdk-feasibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned spike dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
        working-directory: spikes/sdk-feasibility
      - name: Check typed tools against the installed SDK
        run: npm run typecheck
        working-directory: spikes/sdk-feasibility
      - name: Run deterministic local SDK assertions
        run: npm run probe
        working-directory: spikes/sdk-feasibility
      - name: Check Codex SDK lifecycle against local fake executable
        run: npm run codex-conformance
        working-directory: spikes/sdk-feasibility
      - name: Check bounded access harness without provider requests
        run: npm run pi-access-probe-test
        working-directory: spikes/sdk-feasibility
